{% extends "base.html" %}
{% block title %}{{ title }} — HVCS{% endblock %}
{% block main_class %}page page--narrow{% endblock %}
{% block content %}
<h1 class="page-title">{{ title }}</h1>
<p class="page-subtitle">Fill in the details below and click Save.</p>

<form method="post" class="form-shell">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="action-row action-row--top">
        <button type="submit" class="button">Save Manager</button>
        <a class="button-link" href="{% url 'manager_list' %}">Cancel</a>
    </div>
</form>
{% endblock %}
